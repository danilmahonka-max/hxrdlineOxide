const store='hxrdline_demo_v1',usedStore='hxrdline_used_v1',gate=document.getElementById('gate'),key=document.getElementById('key'),msg=document.getElementById('msg');
function check(){let a=JSON.parse(localStorage.getItem(store)||'null');let ok=a&&a.exp>Date.now();document.getElementById('access').textContent=ok?'Активен':'Не активен';document.getElementById('expiry').textContent=ok?'Демо-доступ до '+new Date(a.exp).toLocaleString():'Требуется ключ активации';gate.style.display=ok?'none':'grid'}
key.oninput=()=>key.value=key.value.replace(/\D/g,'').slice(0,6);
document.getElementById('form').onsubmit=e=>{e.preventDefault();let code=key.value;if(!/^\d{6}$/.test(code)){msg.textContent='Введи ровно 6 цифр.';return}let used=JSON.parse(localStorage.getItem(usedStore)||'[]');if(used.includes(code)){msg.textContent='Ключ уже использован.';return}let rec=window.HXRD_KEYS.find(x=>x.key===code);if(!rec){msg.textContent='Ключ не найден.';return}localStorage.setItem(store,JSON.stringify({key:code,exp:Date.now()+rec.days*86400000,days:rec.days}));used.push(code);localStorage.setItem(usedStore,JSON.stringify(used));msg.textContent='';check()};
