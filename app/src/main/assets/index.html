<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10091b"><title>HXRDLINE Access</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 20%,#48206c 0,transparent 42%),linear-gradient(145deg,#090610,#160b24 65%,#090610);color:#f7edff;font:16px system-ui;display:grid;place-items:center;padding:20px}main{width:min(100%,440px);padding:28px;border:1px solid #a34be777;border-radius:26px;background:#170e23ed;box-shadow:0 22px 70px #0009,0 0 36px #a33cff22}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:900;background:linear-gradient(135deg,#df83ff,#7623ce);box-shadow:0 0 30px #a33cff77;margin-bottom:22px}.tag{font-size:11px;letter-spacing:1.6px;color:#d6a9f7;border:1px solid #9b4acb;border-radius:30px;padding:6px 10px;display:inline-block;margin-bottom:17px}h1{font-size:29px;line-height:1.12;margin:0 0 10px}p{color:#bda9cc;line-height:1.55;margin:0 0 25px;font-size:14px}label{display:block;font-size:13px;color:#e4d5ef;margin-bottom:9px}input{width:100%;padding:17px;border-radius:13px;border:1px solid #75449b;background:#0d0815;color:white;font:700 22px system-ui;letter-spacing:9px;text-align:center;outline:none}input:focus{border-color:#d77aff;box-shadow:0 0 0 3px #bb59ff33}button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:13px;background:linear-gradient(100deg,#8c2bd3,#c34bff);color:white;font-weight:850;font-size:15px}#msg{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:13px;line-height:1.5}#msg.show{display:block}#msg.err{background:#381a2a;color:#ffc9da;border:1px solid #90405e}#msg.ok{background:#142e29;color:#b8ffe6;border:1px solid #2d806b}#active{display:none;margin-top:16px;padding:16px;border-radius:14px;background:#132d28;border:1px solid #327c69}#active strong{color:#a9ffdd;display:block;margin-bottom:8px}.timer{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}small{display:block;color:#8e7c9e;text-align:center;font-size:10px;line-height:1.5;margin-top:22px}.secondary{background:#30203e;border:1px solid #75449b}</style></head><body><main><div class="logo">H</div><div class="tag">✦ HXRDLINE ACCESS</div><h1>Введи ключ доступа</h1><p>Добро пожаловать в <b>hxrdlineOxide</b>. Введи свой шестизначный ключ для тестовой активации.</p><form id="form"><label for="key">КЛЮЧ АКТИВАЦИИ</label><input id="key" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><button>АКТИВИРОВАТЬ →</button></form><div id="msg" role="status"></div><div id="active"><strong>✓ Демо-доступ активирован</strong><div>Осталось:</div><div class="timer" id="timer"></div><button class="secondary" id="reset" type="button">Сбросить демо</button></div><small>HXRDLINE KEY · TEST BUILD<br>Демо-ключи встроены в APK и не являются защищённой лицензией.</small></main><script src="keys.js"></script><script>
const form=document.getElementById('form'),input=document.getElementById('key'),msg=document.getElementById('msg'),active=document.getElementById('active'),timer=document.getElementById('timer'),store='hxrdline_demo_v1';
function notice(t,k){msg.textContent=t;msg.className='show '+k}
function update(){const a=JSON.parse(localStorage.getItem(store)||'null');if(!a)return;let left=a.exp-Date.now();if(left<=0){localStorage.removeItem(store);active.style.display='none';form.style.display='block';notice('Срок действия демо-ключа истёк.','err');return}let s=Math.floor(left/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;timer.textContent=d+'д '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
input.addEventListener('input',()=>input.value=input.value.replace(/\D/g,'').slice(0,6));
form.addEventListener('submit',e=>{e.preventDefault();let code=input.value;if(!/^\d{6}$/.test(code)){notice('Введи ровно 6 цифр.','err');return}let a=JSON.parse(localStorage.getItem(store)||'null');if(a&&a.key===code&&a.exp>Date.now()){notice('Этот ключ уже активирован на этом устройстве.','ok');return}if(a&&a.key===code){notice('Срок этого ключа истёк.','err');return}let used=JSON.parse(localStorage.getItem('hxrdline_used_v1')||'[]');if(used.includes(code)){notice('Этот ключ уже использован на этом устройстве.','err');return}let rec=window.HXRD_KEYS.find(x=>x.key===code);if(!rec){notice('Ключ не найден. Проверь цифры.','err');return}let exp=Date.now()+rec.days*86400000;localStorage.setItem(store,JSON.stringify({key:code,exp,days:rec.days}));used.push(code);localStorage.setItem('hxrdline_used_v1',JSON.stringify(used));form.style.display='none';notice('Ключ принят · срок '+rec.days+' дн.','ok');active.style.display='block';update()});
document.getElementById('reset').onclick=()=>{localStorage.removeItem(store);active.style.display='none';form.style.display='block';input.value='';notice('Локальное демо-состояние сброшено.','ok')};
if(JSON.parse(localStorage.getItem(store)||'null')?.exp>Date.now()){form.style.display='none';active.style.display='block';update()}setInterval(update,1000);
</script></body></html>
